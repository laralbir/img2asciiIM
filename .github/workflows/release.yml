name: Publish Signed Release APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed APK & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run TDD Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts and Checksum
        run: |
          TAG_NAME="${{ github.ref_name }}"
          RELEASE_DIR="app/build/outputs/apk/release"
          APK_NAME="img2asciiIM-${TAG_NAME}.apk"
          
          # Move output APK to tagged name
          cp "${RELEASE_DIR}/app-release.apk" "./${APK_NAME}"
          
          # Generate SHA-256 Checksum
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          
          echo "Generated ${APK_NAME} ($(stat -c%s "${APK_NAME}") bytes)"
          cat "${APK_NAME}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "img2asciiIM ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            img2asciiIM-${{ github.ref_name }}.apk
            img2asciiIM-${{ github.ref_name }}.apk.sha256
          draft: false
          prerelease: false
