name: Android TDD CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-build:
    name: JVM Unit + Robolectric Tests & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run TDD Unit & Robolectric Compose Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble Debug & AndroidTest APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Verify ADB Debug Script Syntax
        run: bash -n scripts/adb-debug.sh
